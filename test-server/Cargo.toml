[package]
name = "praddle-test-server"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.102"
axum = "0.8.8"
clap = { version = "4.6.0", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.27.0"
tokio = { version = "1.50.0", features = ["macros", "net", "process", "rt-multi-thread", "signal"] }
